name: Build unsigned IPA (Windows-friendly)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    # GitHub 的 macOS runner 自带 Xcode 16/26，可以编译 SwiftUI 工程。
    # 想锁定版本可以换成 macos-15 或 macos-26。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "$latest" ]; then
            echo "使用 $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            echo "使用 runner 默认 Xcode"
          fi
          xcodebuild -version
          (xcodebuild -showsdks | grep -i iphoneos) || true

      - name: Build (without code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project EPUBTranslator.xcodeproj \
            -scheme EPUBTranslator \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          app="$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app" ]; then
            echo "没有找到 .app，说明编译失败了，请看上面的 xcodebuild 输出。"
            exit 1
          fi
          echo "打包 $app"
          rm -rf Payload EPUBTranslator-unsigned.ipa
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry EPUBTranslator-unsigned.ipa Payload
          ls -lh EPUBTranslator-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUBTranslator-unsigned-ipa
          path: EPUBTranslator-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7
