name: Build unsigned IPA (Windows-friendly)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    # GitHub 的 macOS runner 自带 Xcode 16/26，可以编译 SwiftUI 工程。
    # 想锁定版本可以换成 macos-15 或 macos-26。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "$latest" ]; then
            echo "使用 $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            echo "使用 runner 默认 Xcode"
          fi
          xcodebuild -version
          (xcodebuild -showsdks | grep -i iphoneos) || true

      - name: Build (without code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project EPUBTranslator.xcodeproj \
            -scheme EPUBTranslator \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      # 把编译错误压成几行写进本次运行的 Summary，
      # 这样在 Windows 上不用复制上千行日志也能看到根因。
      - name: Compile error summary
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "没有 build.log（构建步骤没有跑到）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## 编译错误（最多 20 行）"
            echo '```'
            grep -E "error: " build.log | head -n 20 || echo "没有匹配到 error:"
            echo '```'
            echo "## 失败的命令"
            echo '```'
            grep -A 6 "The following build commands failed" build.log | head -n 10 || echo "无"
            echo '```'
            echo "完整日志在下面 Artifacts 的 xcodebuild-log 里。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "---- 错误摘要 ----"
          grep -E "error: " build.log | head -n 20 || true

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          app="$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app" ]; then
            echo "没有找到 .app，说明编译失败了，请看上面的 xcodebuild 输出。"
            exit 1
          fi
          echo "打包 $app"
          rm -rf Payload EPUBTranslator-unsigned.ipa
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry EPUBTranslator-unsigned.ipa Payload
          ls -lh EPUBTranslator-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUBTranslator-unsigned-ipa
          path: EPUBTranslator-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build.log
            build/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7
